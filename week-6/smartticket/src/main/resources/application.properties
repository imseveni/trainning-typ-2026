spring.application.name=smartticket

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/smartticket_db
spring.datasource.username=root
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# JWT: khóa mặc định chỉ dùng cho demo local; môi trường khác nên đặt biến JWT_SECRET.
app.jwt.issuer=smartticket-local
app.jwt.secret=${JWT_SECRET:U21hcnRUaWNrZXQtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMi1ieXRlcw==}
app.jwt.expiration-minutes=30



